<!--
  ══════════════════════════════════════════════════════════════════
  BLINDAJE ANTI SMS DOBLE
  ══════════════════════════════════════════════════════════════════

  QUÉ HACE
  Vigila las peticiones que sale de la página. Si la misma petición sale
  dos veces seguidas (el mismo mensaje al mismo número en menos de 6
  segundos), deja pasar la primera y tira la segunda a la basura.

  Da igual por qué se duplicaba: el botón con el aviso puesto dos veces,
  el archivo .js incluido dos veces, o un doble toque sin querer. Las
  tres se cortan aquí.

  DÓNDE SE PONE
  Al final del archivo chat.php, JUSTO ANTES de la línea que pone
  </body>. Se pega tal cual, con las etiquetas <script> incluidas.

  ANTES DE TOCAR NADA: haz una copia del archivo. Si algo va mal,
  la recuperas y ya está.

  SI NO FUNCIONA
  Entonces la duplicación no está en el navegador sino en el PHP (llama
  dos veces a Twilio). Quita esto y dímelo, que eso se arregla en otro
  sitio.
  ══════════════════════════════════════════════════════════════════
-->

<script>
(function () {
  'use strict';

  // Si el archivo acabara pegado dos veces, el segundo envoltorio
  // envolvería al primero y podría anularlo. Con esto solo entra uno.
  if (window.__antiDobleActivo) { return; }
  window.__antiDobleActivo = true;

  /*
   * VENTANA: cuánto tiempo consideramos que dos peticiones idénticas son
   * la misma pulsación duplicada.
   *
   * Se queda corta a propósito. Las tres causas del doble envío ocurren
   * en milisegundos: el manejador enganchado dos veces dispara las dos
   * peticiones en el mismo instante, y un doble toque humano no llega al
   * medio segundo. Con 2,5 segundos se cubren todas.
   *
   * No se pone más alto porque muchos paneles piden estado al servidor
   * cada pocos segundos con una petición siempre igual; con una ventana
   * larga las tomaríamos por duplicados y romperíamos la pantalla.
   */
  var VENTANA = 2500;
  var recientes = {};          // objeto simple: funciona en cualquier navegador

  function limpiar(ahora) {
    for (var k in recientes) {
      if (Object.prototype.hasOwnProperty.call(recientes, k) && ahora - recientes[k] > VENTANA) {
        delete recientes[k];
      }
    }
  }

  /**
   * ¿Ya ha salido esta misma petición hace un momento?
   *
   * Solo se vigilan las peticiones que llevan datos dentro. Una petición
   * con el cuerpo vacío no es un envío de SMS: suele ser el panel
   * preguntando al servidor cómo va, y ésas tienen que pasar siempre.
   */
  function esRepetida(metodo, url, cuerpo) {
    if (!cuerpo) { return false; }

    var clave = 'k|' + metodo + '|' + url + '|' + cuerpo;   // el prefijo evita
    var ahora = Date.now();                                 // chocar con claves
    limpiar(ahora);                                         // internas del objeto

    if (Object.prototype.hasOwnProperty.call(recientes, clave)) { return true; }

    recientes[clave] = ahora;
    return false;
  }

  /** Convierte el cuerpo de la petición en texto, para poder compararlo. */
  function aTexto(cuerpo) {
    try {
      if (!cuerpo) { return ''; }
      if (typeof cuerpo === 'string') { return cuerpo; }
      if (cuerpo instanceof URLSearchParams) { return cuerpo.toString(); }
      if (typeof FormData !== 'undefined' && cuerpo instanceof FormData) {
        var p = [];
        cuerpo.forEach(function (v, k) {
          p.push(k + '=' + (typeof v === 'string' ? v : '[archivo]'));
        });
        return p.sort().join('&');
      }
      return String(cuerpo);
    } catch (e) { return ''; }
  }

  /* ---------- 1. fetch ---------- */
  if (window.fetch) {
    var fetchOriginal = window.fetch;

    window.fetch = function (recurso, opciones) {
      try {
        var url    = (typeof recurso === 'string') ? recurso : (recurso && recurso.url) || '';
        var metodo = ((opciones && opciones.method) || 'GET').toUpperCase();

        if (metodo !== 'GET' && metodo !== 'HEAD') {
          if (esRepetida(metodo, url, aTexto(opciones && opciones.body))) {
            console.warn('[anti-doble] Envío repetido bloqueado:', url);
            // Devolvemos una respuesta correcta de mentira, para que la
            // página no se quede colgada ni enseñe un error a la operadora.
            return Promise.resolve(new Response('{"ok":true,"duplicado":true}', {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            }));
          }
        }
      } catch (e) { /* si algo falla aquí, se deja pasar la petición */ }

      return fetchOriginal.apply(this, arguments);
    };
  }

  /* ---------- 2. XMLHttpRequest ---------- */
  if (window.XMLHttpRequest) {
    var abrirOriginal   = XMLHttpRequest.prototype.open;
    var enviarOriginal  = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function (metodo, url) {
      this.__ad_metodo = String(metodo || 'GET').toUpperCase();
      this.__ad_url    = String(url || '');
      return abrirOriginal.apply(this, arguments);
    };

    XMLHttpRequest.prototype.send = function (cuerpo) {
      try {
        if (this.__ad_metodo && this.__ad_metodo !== 'GET' && this.__ad_metodo !== 'HEAD'
            && esRepetida(this.__ad_metodo, this.__ad_url, aTexto(cuerpo))) {

          console.warn('[anti-doble] Envío repetido bloqueado:', this.__ad_url);

          var xhr   = this;
          var falsa = '{"ok":true,"duplicado":true}';

          setTimeout(function () {
            try {
              // Le hacemos creer que respondió bien. Es cierto en el fondo:
              // el mensaje SÍ salió, en la primera de las dos peticiones.
              Object.defineProperty(xhr, 'readyState',    { value: 4,     configurable: true });
              Object.defineProperty(xhr, 'status',        { value: 200,   configurable: true });
              Object.defineProperty(xhr, 'statusText',    { value: 'OK',  configurable: true });
              Object.defineProperty(xhr, 'responseText',  { value: falsa, configurable: true });
              Object.defineProperty(xhr, 'response',      { value: falsa, configurable: true });

              // dispatchEvent avisa TANTO a xhr.onload como a los
              // addEventListener('load'). Con llamar solo a onload se
              // quedarían colgadas las páginas que usan lo segundo.
              if (typeof xhr.onreadystatechange === 'function') { xhr.onreadystatechange(); }
              xhr.dispatchEvent(new Event('readystatechange'));
              xhr.dispatchEvent(new Event('load'));
              xhr.dispatchEvent(new Event('loadend'));
            } catch (e) {
              // Si el navegador no deja falsear la respuesta, avisamos por
              // consola. La petición duplicada no sale igualmente, que es
              // lo importante.
              console.warn('[anti-doble] No se pudo simular la respuesta:', e.message);
            }
          }, 10);

          return;
        }
      } catch (e) { /* ante la duda, se deja pasar la petición */ }

      return enviarOriginal.apply(this, arguments);
    };
  }

  /* ---------- 3. Formularios normales (sin JavaScript) ----------
     Un único vigilante: si el mismo formulario se manda dos veces
     seguidas, la segunda se corta. La primera pasa intacta. */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f) { return; }

    if (f.__ad_enviado) {
      e.preventDefault();
      e.stopImmediatePropagation();
      console.warn('[anti-doble] Segundo envío del formulario bloqueado.');
      return;
    }

    f.__ad_enviado = true;
    setTimeout(function () { f.__ad_enviado = false; }, VENTANA);
  }, true);

  console.log('[anti-doble] Blindaje activo.');
})();
</script>
